<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Terminal Games</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e14;
      font-family: 'Fira Code', monospace;
      color: #b3b1ad;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .terminal-header {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      background: #1a1e24;
      border-bottom: 1px solid #2a2e34;
      gap: 8px;
      flex-shrink: 0;
    }
    .terminal-header .dots { display: flex; gap: 6px; }
    .terminal-header .dot { width: 12px; height: 12px; border-radius: 50%; }
    .terminal-header .dot.red { background: #ff5f56; }
    .terminal-header .dot.yellow { background: #ffbd2e; }
    .terminal-header .dot.green { background: #27c93f; }
    .terminal-header .title {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: #5c6773;
    }
    #terminal {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 11px;
      line-height: 1.3;
      scrollbar-width: thin;
      scrollbar-color: #2a2e34 transparent;
    }
    #terminal::-webkit-scrollbar { width: 6px; }
    #terminal::-webkit-scrollbar-track { background: transparent; }
    #terminal::-webkit-scrollbar-thumb { background: #2a2e34; border-radius: 3px; }
    .input-line {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      background: #1a1e24;
      border-top: 1px solid #2a2e34;
      flex-shrink: 0;
    }
    .input-line .prompt {
      color: #39bae6;
      margin-right: 8px;
      font-size: 14px;
    }
    .input-line input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e6e1cf;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      caret-color: #39bae6;
    }
    .green { color: #27c93f; }
    .cyan { color: #39bae6; }
    .yellow { color: #ffbd2e; }
    .red { color: #ff5f56; }
    .bold { font-weight: 700; }
    .dim { opacity: 0.6; }

    /* CRT scanline effect */
    #terminal::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.03) 0px,
        rgba(0, 0, 0, 0.03) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div class="terminal-header">
    <div class="dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="title">java-terminal-games — MainMenu</div>
  </div>
  <div id="terminal"></div>
  <div class="input-line">
    <span class="prompt">❯</span>
    <input id="input" type="text" autofocus autocomplete="off" spellcheck="false" />
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // TERMINAL ENGINE
    // ═══════════════════════════════════════════════════════════════
    const termEl = document.getElementById('terminal');
    const inputEl = document.getElementById('input');
    let inputResolve = null;

    function print(text) {
      termEl.textContent += text;
      termEl.scrollTop = termEl.scrollHeight;
    }
    function println(text = '') {
      print(text + '\n');
      termEl.scrollTop = termEl.scrollHeight;
    }
    function cls() {
      termEl.textContent = '';
    }
    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
    function readLine(prompt = '') {
      if (prompt) print(prompt);
      inputEl.value = '';
      inputEl.focus();
      return new Promise(resolve => {
        inputResolve = resolve;
      });
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && inputResolve) {
        const val = inputEl.value;
        println(val);
        inputEl.value = '';
        const r = inputResolve;
        inputResolve = null;
        r(val);
      }
    });

    // Click anywhere to focus input
    document.addEventListener('click', () => inputEl.focus());

    // ═══════════════════════════════════════════════════════════════
    // MAIN MENU
    // ═══════════════════════════════════════════════════════════════
    async function mainMenu() {
      while (true) {
        cls();
        println("=================================================");
        println("  _   _                 _               _        ");
        println(" | | | |               | |             | |       ");
        println(" | |_| | ___  _ __ ___ | |__   ___  ___| | _____ ");
        println(" |  _  |/ _ \\| '_ ` _ \\| '_ \\ / _ \\/ __| |/ / __|");
        println(" | | | | (_) | | | | | | |_) | (_) \\__ \\   <\\__ \\");
        println(" \\_| |_/\\___/|_| |_| |_|_.__/ \\___/|___/_|\\_\\___/");
        println("=================================================");
        println("              JAVA TERMINAL GAMES                ");
        println("=================================================");
        println("1. Tic Tac Toe");
        println("2. Connect 4");
        println("3. BlackJack");
        println("4. Poker");
        println("5. Threes");
        println("6. Cows And Bulls");
        println("7. WalkMan");
        println("8. Elevator");
        println("9. Exit");
        println("=================================================");
        const input = await readLine("Enter the number of the game you want to play: ");
        const choice = parseInt(input.trim());
        if (isNaN(choice) || choice < 1 || choice > 9) {
          println("Invalid input. Please enter a number between 1 and 9.");
          await sleep(1500);

        }
        try {
          switch (choice) {
            case 1: cls(); println("\nStarting Tic Tac Toe...\n"); await ticTacToe(); break;
            case 2: cls(); println("\nStarting Connect 4...\n"); await connect4(); break;
            case 3: cls(); println("\nStarting BlackJack...\n"); await blackJack(); break;
            case 4: cls(); println("\nStarting Poker...\n"); await poker(); break;
            case 5: cls(); println("\nStarting Threes...\n"); await threes(); break;
            case 6: cls(); println("\nStarting Cows And Bulls...\n"); await cowsAndBulls(); break;
            case 7: cls(); println("\nStarting WalkMan...\n"); await walkMan(); break;
            case 8: cls(); println("\nStarting Elevator...\n"); await elevator(); break;
            case 9: cls(); println("Exiting... Thanks for playing!"); return;
          }
        } catch (e) {
          println("\nAn error occurred while running the game: " + e.message);
        }
        println("\nReturning to Main Menu...\n");
        await sleep(1000);
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // 1. TIC TAC TOE
    // ═══════════════════════════════════════════════════════════════
    async function ticTacToe() {
      let arr = [[' ',' ',' '],[' ',' ',' '],[' ',' ',' ']];

      function printBoard() {
        for (let i = 0; i < 3; i++) {
          let k = 0;
          for (let j = 0; j < 5; j++) {
            if (j % 2 === 0) print("  " + arr[i][k++]);
            else print(" |");
          }
          println();
          if (i !== 2) println("______________");
        }
      }

      function check() {
        let m = arr[0][0], n = arr[0][2];
        let h = 0, r = 0;
        for (let i = 0; i < 3; i++) {
          let k = arr[i][0], l = arr[0][i], f = 1, g = 1;
          for (let j = 1; j < 3; j++) {
            if (arr[i][j] === k) f++;
            if (arr[j][i] === l) g++;
          }
          if (f === 3 && k !== ' ') return k;
          if (g === 3 && l !== ' ') return l;
          if (arr[i][i] === m) h++;
          if (arr[i][2 - i] === n) r++;
        }
        if (h === 3 && m !== ' ') return m;
        if (r === 3 && n !== ' ') return n;
        return 'n';
      }

      async function accept(ch) {
        const input = await readLine("Enter Position for " + ch + " (1-9): ");
        const n = parseInt(input);
        cls();
        if (n > 9 || n < 1) {
          println("Aukat ke BAHAR MATT JAA");
          printBoard();
          return accept(ch);
        }
        const q = (n - 1) % 3, p = Math.floor((n - 1) / 3);
        if (arr[p][q] === ' ') arr[p][q] = ch;
        else {
          println("Occupado.");
          printBoard();
          return accept(ch);
        }
      }

      cls();
      printBoard();
      for (let i = 0; i < 9; i++) {
        if (i % 2 === 0) await accept('O');
        else await accept('X');
        printBoard();
        if (check() === 'O') { println("O : Tumse naa hoo payi "); break; }
        if (check() === 'X') { println("X tera treat"); break; }
        if (i === 8) println("Tumlog se naa hoo payi");
      }
      const op = await readLine("Do u want to play again(Y/N) ? ");
      if (op.charAt(0) === 'Y' || op.charAt(0) === 'y') return ticTacToe();
    }

    // ═══════════════════════════════════════════════════════════════
    // 2. CONNECT 4
    // ═══════════════════════════════════════════════════════════════
    async function connect4() {
      const sc = { nextInt: async (prompt) => parseInt(await readLine(prompt)), nextLine: async (prompt) => await readLine(prompt) };
      let mainChoice;
      do {
        let arr = Array.from({length:7}, () => Array(7).fill(' '));
        let c = Array(7).fill(0);

        function display() {
          cls();
          println("\nWelcome to Shubham Periwal's CONNECT 4!");
          println("\n| 1 | 2 | 3 | 4 | 5 | 6 | 7 |");
          println("____________________________");
          for (let i = 0; i < 7; i++) {
            let row = '';
            for (let j = 0; j < 7; j++) {
              if (j === 0) row += '| ';
              row += (arr[i][j] === 'X' || arr[i][j] === 'O' ? arr[i][j] : ' ') + ' | ';
            }
            println(row);
            println("____________________________");
          }
        }

        function isFull(r) { return arr[0][r] === 'X' || arr[0][r] === 'O'; }

        function insert(p, r) {
          let i = c[r]; c[r]++;
          arr[6 - i][r] = (p % 2 === 0) ? 'O' : 'X';
        }

        function isOver(choice, r) {
          let cnt1 = 0, cnt2 = 0, col = c[r], curr;
          // vertical
          if (col >= 4) {
            cnt1 = 0; cnt2 = 0;
            for (let i = 6; i >= 0; i--) {
              if (arr[i][r] === 'X') { cnt2++; cnt1 = 0; }
              else if (arr[i][r] === 'O') { cnt1++; cnt2 = 0; }
              else { cnt1 = 0; cnt2 = 0; }
            }
            if (cnt2 >= 4) {
              println(choice === 1 ? "Aaj khush toh bohot hoge tum...Computer ko hara ke" : "X WINS!");
              return true;
            }
            if (cnt1 >= 4) {
              println(choice === 1 ? "Saale doob marr chutki bhar paani mein! Khela ses" : "O WINS!");
              return true;
            }
          }
          // horizontal
          for (let j = 0; j < 4; j++) {
            curr = arr[7 - col][j];
            if ((curr === 'X' || curr === 'O') && curr === arr[7 - col][j + 1] && curr === arr[7 - col][j + 2] && curr === arr[7 - col][j + 3]) {
              println(choice === 1 ? (curr === 'X' ? "Aaj khush toh bohot hoge tum...Computer ko hara ke" : "Saale doob marr chutki bhar paani mein! Khela ses") : curr + " WINS!!");
              return true;
            }
          }
          // left diagonal
          for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
            curr = arr[i][j];
            if ((curr === 'X' || curr === 'O') && curr === arr[i+1][j+1] && curr === arr[i+2][j+2] && curr === arr[i+3][j+3]) {
              println(choice === 1 ? (curr === 'X' ? "Aaj khush toh bohot hoge tum...Computer ko hara ke" : "Saale doob marr chutki bhar paani mein! Khela ses") : curr + " WINS!!");
              return true;
            }
          }
          // right diagonal
          for (let i = 0; i < 4; i++) for (let j = 6; j > 2; j--) {
            curr = arr[i][j];
            if ((curr === 'X' || curr === 'O') && curr === arr[i+1][j-1] && curr === arr[i+2][j-2] && curr === arr[i+3][j-3]) {
              println(choice === 1 ? (curr === 'X' ? "Aaj khush toh bohot hoge tum...Computer ko hara ke" : "Saale doob marr chutki bhar paani mein! Khela ses") : curr + " WINS!!");
              return true;
            }
          }
          // draw
          let full = true;
          for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) if (arr[i][j] !== 'X' && arr[i][j] !== 'O') full = false;
          if (full) { println("GAME DRAW!"); return true; }
          return false;
        }

        println("\nWelcome to Shubham Periwal's CONNECT 4!");
        println("\nGAME MENU OPTIONS");
        println("1.Awww poor baby is playing alone? Press 1");
        println("2.You got another 1 to waste time with you? Cool. Press 2");
        println("3.Read the rules. Learn how you're gonna waste your time. Press 3");
        println("4.Get the hell outta here. Press 4");
        mainChoice = parseInt(await readLine("\nEnter your choice man..I dont have all day! "));
        if (mainChoice === 1 || mainChoice === 2) display();

        let p = 1, r = 0, gameOver = false;
        while (!gameOver) {
          if (mainChoice === 1 || mainChoice === 2) {
            if (mainChoice === 1) {
              if (p % 2 === 1) {
                r = parseInt(await readLine("\nEnter the column number: "));
              } else {
                r = Math.floor(Math.random() * 7) + 1;
                println("\nComputer selects column: " + r);
              }
            } else {
              r = parseInt(await readLine("\nEnter fast player #" + (p % 2 + 1) + ": "));
            }
            if (r === 0) { println("EXIT. Thank you for wasting my charge loser. Get a LIFE"); mainChoice = 4; break; }
            if (r < 1 || r > 7) { println("You blind Gatsby! Where can you see column #" + r + "!"); }
            else {
              if (!isFull(r - 1)) insert(p++, r - 1);
              else { println("This column is full..try another 1"); p--; if (isOver(mainChoice, r - 1)) break; continue; }
              display();
              if (isOver(mainChoice, r - 1)) break;
            }
          } else if (mainChoice === 3) {
            cls(); println("RULES FOR WASTING YOUR TIME");
            println("\nEnter the column number in which you want to enter your coin.");
            println("Make a combination of 4 similar coins to win the game.");
            println("Combination may be horizontal, vertical, or diagonal.");
            println("Press 0 to exit at any point of time. ");
            println("\nUnderstood idiot? Now get started!");
            break;
          } else if (mainChoice === 4) { println("Wise decision. Now go study!"); break; }
          else { println("Read the menu you illiterate buffoon. Enter correctly!"); break; }
        }
        if (r !== 0 && (mainChoice === 1 || mainChoice === 2)) {
          println("\nEk aur game ki keemat tum kya jaano player babu! ");
          const ch = await readLine("Press 'y' to find out and 'n' to go back to your momma: ");
          if (ch.charAt(0) === 'Y' || ch.charAt(0) === 'y') { println("Shabaash"); }
          else if (ch.charAt(0) === 'N' || ch.charAt(0) === 'n') { println("Wise decision. Go study!"); return; }
          else { println("Sasura 'y' ya 'n' enter karne ka tha!"); }
        }
      } while (mainChoice !== 4);
    }

    // ═══════════════════════════════════════════════════════════════
    // 3. BLACKJACK
    // ═══════════════════════════════════════════════════════════════
    async function blackJack() {
      let w = 0, l = 0, dr = 0;

      function getCard() {
        let x = Math.floor(Math.random() * 13) + 1;
        return x;
      }

      function cardChar(x) {
        if (x === 11) return 'J';
        if (x === 12) return 'Q';
        if (x === 13) return 'K';
        if (x === 1) return 'A';
        return String(x);
      }

      function printCards(d, p, dt, pt) {
        cls();
        println("Dealer :                                               WINS:" + w + " LOSSES:" + l + " DRAWS:" + dr);
        if (dt >= 0) {
          for (let i = 0; i < 5; i++) {
            let line = '';
            for (let j = 0; j <= dt; j++) {
              const k = cardChar(d[j]);
              if (i === 0) line += "  _______ ";
              if (i === 1) line += (d[j] === 10 ? " |10     |" : " |" + k + "      |");
              if (i === 2) line += " |       |";
              if (i === 3) line += (d[j] === 10 ? " |     10|" : " |      " + k + "|");
              if (i === 4) line += " '-------'";
            }
            println(line);
          }
        }
        println("Player :");
        if (pt >= 0) {
          for (let i = 0; i < 5; i++) {
            let line = '';
            for (let j = 0; j <= pt; j++) {
              const k = cardChar(p[j]);
              if (i === 0) line += "  _______ ";
              if (i === 1) line += (p[j] === 10 ? " |10     |" : " |" + k + "      |");
              if (i === 2) line += " |       |";
              if (i === 3) line += (p[j] === 10 ? " |     10|" : " |      " + k + "|");
              if (i === 4) line += " '-------'";
            }
            println(line);
          }
        }
      }

      function sum(arr, l) {
        let s = 0, c = 0;
        for (let i = 0; i <= l; i++) {
          if (arr[i] >= 11) s += 10;
          else if (arr[i] === 1) { s += 1; c++; }
          else s += arr[i];
        }
        for (let i = 0; i < c; i++) { if (s + 10 <= 21) s += 10; }
        return s;
      }

      async function play() {
        let d = [], p = [], dt = -1, pt = -1, flag = 0, z = 0;
        printCards(d, p, dt, pt);
        await sleep(300);
        d[++dt] = getCard();
        printCards(d, p, dt, pt);
        await sleep(300);
        p[++pt] = getCard();
        printCards(d, p, dt, pt);
        await sleep(300);
        let ch;
        do {
          p[++pt] = getCard();
          printCards(d, p, dt, pt);
          await sleep(300);
          if (sum(d, dt) === 10 || sum(d, dt) === 11) {
            d[++dt] = getCard();
            if (sum(d, dt) === 21) {
              printCards(d, p, dt, pt);
              println("DEALER HAS A BLACKJACK, PLAYER LOSES!!!");
              flag = 2; break;
            } else { --dt; z = 1; }
          }
          if (pt === 1 && sum(p, pt) === 21) {
            println("PLAYER HAS A BLACKJACK, PLAYER WINS!!!");
            flag = 1; break;
          }
          if (sum(p, pt) > 21) {
            println("PLAYER BUSTED, PLAYER LOSES!!!");
            flag = 2; break;
          }
          println("Hit or Stand(H/S)?");
          do {
            ch = (await readLine()).charAt(0).toUpperCase();
            if (ch !== 'H' && ch !== 'S') println("Wrong Input. Try Again");
          } while (ch !== 'H' && ch !== 'S');
        } while (ch === 'H');

        if (flag === 0) {
          if (z === 1) ++dt;
          while (sum(d, dt) <= sum(p, pt)) {
            if (sum(d, dt) === 16) { d[++dt] = getCard(); printCards(d, p, dt, pt); await sleep(300); }
            if (sum(d, dt) === 17) break;
            if (sum(d, dt) > 21) { flag = 1; break; }
            d[++dt] = getCard();
            printCards(d, p, dt, pt);
            await sleep(300);
          }
          printCards(d, p, dt, pt);
          if (flag === 1) println("DEALER BUSTED, PLAYER WINS!!!");
          else if (sum(d, dt) > sum(p, pt) && sum(d, dt) <= 21) { flag = 2; println("PLAYER LOSES, DEALER WINS!!!"); }
          else if (sum(d, dt) === sum(p, pt)) { flag = 3; println("DRAW!!!"); }
          else { flag = 1; println("DEALER LOSES, PLAYER WINS!!!"); }
        }
        if (flag === 1) w++;
        else if (flag === 2) l++;
        else if (flag === 3) dr++;

        println("PLAY AGAIN (Y/N)?");
        let k;
        do {
          k = (await readLine()).charAt(0).toUpperCase();
          if (k !== 'Y' && k !== 'N') println("Wrong Input. Try Again");
        } while (k !== 'Y' && k !== 'N');
        if (k === 'Y') return play();
        else { cls(); println("WINS:" + w + " LOSSES:" + l + " DRAWS:" + dr); }
      }

      let mainK;
      outer:
      do {
        cls();
        println("Choose your option:");
        println("1. Play");
        println("2. How to play");
        println("3. Credits");
        println("4. Exit");
        println();
        let ch;
        do {
          ch = parseInt(await readLine("Your Choice :"));
          if (ch < 1 || ch > 4) println("Wrong Input. Try Again");
        } while (ch < 1 || ch > 4);
        switch (ch) {
          case 1: await play(); break;
          case 2:
            cls();
            println("GOAL : Your goal is to draw cards that total 21, or come closer to 21 than the dealer without going over.");
            println(); println("HOW TO PLAY : "); println();
            println(" The dealer and each player get two cards. The dealer's first card faces up, the second faces down.");
            println(" Face cards each count as 10, Aces count as 1 or 11, all others count at face value.");
            println(" Any First 2 cards with an Ace with any 10, Jack, Queen, or King is a BLACKJACK.");
            println(" If you have a Blackjack, you Win.");
            println(" If you don't have a Blackjack, you can ask the dealer to HIT you by typing \"H\".");
            println(" You may draw as many cards as you like (one at a time), but if you go over 22, you BUST and lose.");
            println(" If you do not want to HIT you may STAND by typing \"S\".");
            println(" After all players are satisfied with their hands, the dealer will turn his or her down card face up and stand or draw as necessary.");
            break;
          case 3:
            const creds = ["Produced by:", "Mayank Musaddi", "", "Written by:", "Mayank Musaddi", "", "Edited by:", "Mayank Musaddi", "", "Supervising Editor:", "Suyash Musaddi", "", "Additional Graphics:", "Mayank Musaddi", "", "Special Thanks:", "SabhyaSanchi Trivedi", "Sanchayan Rey"];
            cls();
            for (const c of creds) { println(c); await sleep(200); }
            break;
          case 4: cls(); println("Thank You For Playing.."); break outer;
        }
        println();
        do {
          mainK = (await readLine("Go back to the Main Menu (Y/N) :")).charAt(0).toUpperCase();
          if (mainK !== 'Y' && mainK !== 'N') println("Wrong Input. Try Again");
        } while (mainK !== 'Y' && mainK !== 'N');
      } while (mainK === 'Y');
      cls(); println("Thank You for Playing..  Come back soon.");
    }

    // ═══════════════════════════════════════════════════════════════
    // 4. POKER
    // ═══════════════════════════════════════════════════════════════
    async function poker() {
      println("\n\n\n\n\n\t\t*********************");
      println("\t\t*\t\t    *");
      println("\t\t*  WELCOME TO THE   *");
      println("\t\t*  PERDHARY POKER   *");
      println("\t\t*\t\t    *");
      println("\t\t*********************");

        let c1 = col[0], c2 = col[1];
        let cnt1 = c1 === c2 ? 2 : 1, cnt2 = 1;
        for (let i = 0; i < 5; i++) { if (potCol[i] === c1) cnt1++; if (potCol[i] === c2) cnt2++; }

      function isStraight(num) {
        for (let cnt = 1; cnt <= 10; cnt++) {
          let count = 0;
          for (let i = cnt; i < cnt + 5; i++) {
            const a = (i === 1 || i === 14) ? "A" : i === 11 ? "J" : i === 12 ? "Q" : i === 13 ? "K" : String(i);
            if (num[0] === a || num[1] === a) count++;
            for (let j = 0; j < 5; j++) { if (potNum[j] === a && potNum[j] !== num[0] && potNum[j] !== num[1]) { count++; break; } }
          }
          if (count === 5) return true;
        }
        return false;
      }
      function isOnePair(num) {
        if (num[0] === num[1]) return true;
        for (let i = 0; i < 5; i++) if (getCnt(potNum, potNum[i]) === 2 || potNum[i] === num[0] || potNum[i] === num[1]) return true;
        return false;
      }
      function isTrips(num) {
        for (let i = 0; i < 5; i++) {
          let count = getCnt(potNum, potNum[i]);
          if (count === 3 || (count === 2 && (potNum[i] === num[0] || potNum[i] === num[1])) || (count === 1 && potNum[i] === num[0] && potNum[i] === num[1])) return true;
        }
        return false;
      }
      function isQuad(num) {
        for (let i = 0; i < 5; i++) {
          if (getCnt(potNum, potNum[i]) === 4 || (getCnt(potNum, potNum[i]) === 3 && (potNum[i] === num[0] || potNum[i] === num[1])) || (getCnt(potNum, potNum[i]) === 2 && potNum[i] === num[0] && potNum[i] === num[1])) return true;
        }
        return false;
      }
      function isDoublePair(num) {
        let cnt = 0;
        if (num[0] === num[1]) cnt++;
        if (getCnt(potNum, num[0]) === 1) cnt++;
        if (getCnt(potNum, num[1]) === 1) cnt++;
        if (cnt >= 2) return true;
        for (let i = 0; i < 5; i++) if (getCnt(potNum, potNum[i]) === 2 && potNum[i] !== num[0] && potNum[i] !== num[1]) cnt++;
        return cnt > 2;
      }
      function getPower(num, col) {
        if (isFlush(col) && isStraight(num)) return 2;
        if (isQuad(num)) return 3;
        if (isOnePair(num) && isTrips(num)) return 4;
        if (isFlush(col)) return 5;
        if (isStraight(num)) return 6;
        if (isTrips(num)) return 7;
        if (isDoublePair(num)) return 8;
        if (isOnePair(num)) return 9;
        return 10;

          nu = no === 1 ? "A" : no === 11 ? "J" : no === 12 ? "Q" : no === 13 ? "K" : String(no);

        } while (isPresent(nu, cu));
        return [nu, cu];
      }

    async function threes() {
      let arr = Array.from({length:4}, () => Array(4).fill(0));
      let inTile;

      function ranNo() { return Math.floor(Math.random() * 4); }

      // Initialize
      for (let k = 0; k < 3;) { let i = ranNo(), j = ranNo(); if (arr[i][j] === 0) { arr[i][j] = 1; k++; } }
      for (let k = 0; k < 3;) { let i = ranNo(), j = ranNo(); if (arr[i][j] === 0) { arr[i][j] = 2; k++; } }
      for (let k = 0; k < 3;) { let i = ranNo(), j = ranNo(); if (arr[i][j] === 0) { arr[i][j] = 3; k++; } }

      function display() {
        for (let i = 0; i < 4; i++) {
          for (let k = 0; k < 4; k++) {
            let line = '';
            for (let j = 0; j < 4; j++) {
              const n = 3 - (arr[i][j] > 0 ? Math.floor(Math.log10(arr[i][j])) : 0);
              if (k === 0) line += "  ____  ";
              if (k === 1) line += " |    | ";
              if (k === 2) { if (arr[i][j] === 0) line += " |    | "; else { line += " |" + arr[i][j] + " ".repeat(Math.max(0,n)) + "| "; } }
              if (k === 3) line += " '----' ";
            }
            println(line);
          }
        }
      }

      function canMerge(a, b) { if (b === 0 && a !== 0) return true; if ((a === 1 && b === 2) || (a === 2 && b === 1)) return true; if (a === b && a >= 3) return true; return false; }
      function merge(a, b) { if (b === 0) return [0, a]; if (a + b === 3) return [0, 3]; if (a === b) return [0, 2 * a]; return null; }

      function moveDir(dir, exec) {
        let moved = 0;
        const a = arr;
        if (dir === 'right') {
          for (let j = 2; j >= 0; j--) for (let i = 0; i < 4; i++) { if (canMerge(a[i][j], a[i][j+1])) { if (exec) { const [nv, mv] = merge(a[i][j], a[i][j+1]); a[i][j] = nv; a[i][j+1] = mv; } moved++; } }
          if (exec && moved > 0) { let k; do { k = ranNo(); } while(a[k][0] !== 0); a[k][0] = inTile; }
        } else if (dir === 'left') {
          for (let j = 1; j < 4; j++) for (let i = 0; i < 4; i++) { if (canMerge(a[i][j], a[i][j-1])) { if (exec) { const [nv, mv] = merge(a[i][j], a[i][j-1]); a[i][j] = nv; a[i][j-1] = mv; } moved++; } }
          if (exec && moved > 0) { let k; do { k = ranNo(); } while(a[k][3] !== 0); a[k][3] = inTile; }
        } else if (dir === 'up') {
          for (let i = 1; i < 4; i++) for (let j = 0; j < 4; j++) { if (canMerge(a[i][j], a[i-1][j])) { if (exec) { const [nv, mv] = merge(a[i][j], a[i-1][j]); a[i][j] = nv; a[i-1][j] = mv; } moved++; } }
          if (exec && moved > 0) { let k; do { k = ranNo(); } while(a[3][k] !== 0); a[3][k] = inTile; }
        } else if (dir === 'down') {
          for (let i = 2; i >= 0; i--) for (let j = 0; j < 4; j++) { if (canMerge(a[i][j], a[i+1][j])) { if (exec) { const [nv, mv] = merge(a[i][j], a[i+1][j]); a[i][j] = nv; a[i+1][j] = mv; } moved++; } }
          if (exec && moved > 0) { let k; do { k = ranNo(); } while(a[0][k] !== 0); a[0][k] = inTile; }
        }
        if (!exec) return moved > 0;
        if (moved === 0) println("Can't Move " + dir.charAt(0).toUpperCase() + dir.slice(1));
        return moved > 0;
      }

      println("Welcome to THREES!!!");
      await readLine("Press Enter to Play");
      cls();
      display();
      let m = true;
      do {
        if (m) inTile = Math.floor(Math.random() * 3) + 1;
        println("Next Tile : " + inTile);
        const k = (await readLine("Shift (w/s/a/d) ? :")).charAt(0).toLowerCase();
        cls();
        switch (k) {
          case 'd': m = moveDir('right', true); break;
          case 'a': m = moveDir('left', true); break;
          case 'w': m = moveDir('up', true); break;
          case 's': m = moveDir('down', true); break;
          default: println("Incorrect Input!"); m = false;
        }
        display();
      } while (moveDir('right', false) || moveDir('left', false) || moveDir('up', false) || moveDir('down', false));
      println("Game Over");
      let sc = 0;
      for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
        if (arr[i][j] >= 3) { const tl = Math.floor(Math.log2(arr[i][j] / 3)); sc += Math.pow(3, tl + 1); }
      }
      println("Score : " + sc);
    }

        for (const part of allParts) {

          for (let col = 1; col <= maxLen; col += 3) {
            cls();

        const allParts = [PlayArt, OptionsArt, CreditsArt, ExitArt];
        for (let p = allParts.length - 1; p >= 0; p--) {

    // 8. ELEVATOR
    // ═══════════════════════════════════════════════════════════════
    async function elevator() {
      function printLift(num) {
        println("   ___");
        println("   |" + num + "|");
        println(" -------");
        println("|   |   |");
        println("|   |   |");
        println("|   |   |");
        println(" -------");
      }

      async function animateGo(start, stop) {
        const dir = stop > start ? 1 : -1;
        let floor = start;
        while (floor !== stop) {
          cls();
          println("Please wait while the elevator is moving...");
          for (let i = 0; i < (10 - floor) * 2; i++) println();
          printLift(floor > 0 ? floor : "G");
          await sleep(300);
          floor += dir;
        }
        cls();
        for (let i = 0; i < (10 - floor) * 2; i++) println();
        printLift(floor > 0 ? floor : "G");
      }

      async function animateOpen(num) {
        const frames = ["|   |   |", "||     ||", "| |   | |", "|  | |  |", "|       |"];
        for (const frame of frames) {
          cls();
          for (let i = 0; i < (10 - num) * 2; i++) println();
          println("   ___");
          println("   |" + (num > 0 ? num : "G") + "|");
          println(" -------");
          println(frame); println(frame); println(frame);
          println(" -------");
          await sleep(200);
        }
      }

      async function animateClose(num) {
        const frames = ["|       |", "||     ||", "| |   | |", "|  | |  |", "|   |   |"];
        for (const frame of frames) {
          cls();
          for (let i = 0; i < (10 - num) * 2; i++) println();
          println("   ___");
          println("   |" + (num > 0 ? num : "G") + "|");
          println(" -------");
          println(frame); println(frame); println(frame);
          println(" -------");
          await sleep(200);
        }
      }

      let num = 0;
      cls();
      println("The lift is on floor G");
      printLift("G");

      const flr = await readLine("Which floor are you on?[G-9] ");
      let floor;
      if (flr.toUpperCase() === 'G') floor = 0;
      else if (/^\d$/.test(flr)) floor = parseInt(flr);
      else { println("\nYa we'll create that floor in your dad's building!"); return; }

      await animateGo(num, floor);
      num = floor;
      await animateOpen(num);
      println("Are you waiting for Christmas? Enter man!");
      await sleep(800);
      await animateClose(num);

      const dest = await readLine("\nWhere to, Boss?[G-9] ");
      let destFloor;
      if (dest.toUpperCase() === 'G') destFloor = 0;
      else destFloor = parseInt(dest);
      if (destFloor >= 0 && destFloor < 10) {
        let msg;
        if (Math.abs(destFloor - num) === 1) msg = "Next time take the stairs to travel 1 floor you sloth";
        else if (destFloor === num) msg = "ARE YOU HERE TO TEST MY OPENING/CLOSING SYSTEM? GET OUT!";
        else msg = "Chillax man you'll reach there faast";
        println(msg);
        await animateGo(num, destFloor);
        num = destFloor;
        await animateOpen(num);
        println("Do I have to call security? LEAVE!");
        await sleep(800);
        await animateClose(num);
        println("\nOK..see ya laterrr!");
        await sleep(500);
        cls();
        println("The lift is on floor " + (num > 0 ? num : "G"));
        printLift(num > 0 ? String(num) : "G");
      } else {
        cls();
        printLift(flr);
        println("\nWanna blow off the roof? I won't open the door..You're stuck!");
      }
    }
